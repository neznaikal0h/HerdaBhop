name: Build HerdaBhop 1.20.1 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Bhop Source Files
        shell: python3 {0}
        run: |
          import os
          def write_f(p, c):
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(c.strip() + "\n")
          
          write_f("settings.gradle", """
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }
          rootProject.name = 'herdabhop'
          """)
          
          write_f("gradle.properties", """
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          """)
          
          write_f("build.gradle", """
          plugins {
              id 'eclipse'
              id 'idea'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          version = '1.0.0'
          group = 'ru.herda.bhop'
          base { archivesName = 'herdabhop' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }
          repositories {
              mavenCentral()
          }
          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
          }
          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                      'Specification-Title'   : 'herdabhop',
                      'Specification-Vendor'  : 'Herda',
                      'Specification-Version' : '1',
                      'Implementation-Title'  : project.name,
                      'Implementation-Version': project.version,
                      'Implementation-Vendor' : 'Herda'
                  ])
              }
              finalizedBy 'reobfJar'
          }
          """)

          write_f("src/main/resources/META-INF/mods.toml", """
          modLoader="javafml"
          loaderVersion="[47,)"
          license="All Rights Reserved"
          [[mods]]
          modId="herdabhop"
          version="1.0.0"
          displayName="Herda Bhop (CS2 Style)"
          authors="Herda"
          description="CS2/Source Engine style Bunny Hop mod. Includes Auto-Jump, Air Acceleration, Momentum preservation, and configurable physics."
          [[dependencies.herdabhop]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"
          [[dependencies.herdabhop]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          """)

          write_f("src/main/resources/pack.mcmeta", """
          {
            "pack": {
              "description": "Herda Bhop",
              "pack_format": 15
            }
          }
          """)

          write_f("src/main/java/ru/herda/bhop/HerdaBhopMod.java", """
          package ru.herda.bhop;
          import net.minecraftforge.fml.ModLoadingContext;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.config.ModConfig;
          import ru.herda.bhop.config.BhopConfig;

          @Mod(HerdaBhopMod.MODID)
          public class HerdaBhopMod {
              public static final String MODID = "herdabhop";
              public HerdaBhopMod() {
                  ModLoadingContext.get().registerConfig(ModConfig.Type.COMMON, BhopConfig.SPEC);
              }
          }
          """)

          write_f("src/main/java/ru/herda/bhop/config/BhopConfig.java", """
          package ru.herda.bhop.config;
          import net.minecraftforge.common.ForgeConfigSpec;

          public final class BhopConfig {
              public static final ForgeConfigSpec SPEC;
              public static final ForgeConfigSpec.BooleanValue ENABLE_BHOP;
              public static final ForgeConfigSpec.BooleanValue AUTO_JUMP;
              public static final ForgeConfigSpec.DoubleValue AIR_FRICTION_CANCEL;
              public static final ForgeConfigSpec.DoubleValue WISH_SPEED;
              public static final ForgeConfigSpec.DoubleValue AIR_ACCEL;
              public static final ForgeConfigSpec.DoubleValue MAX_SPEED;
              public static final ForgeConfigSpec.BooleanValue DISABLE_FALL_DAMAGE;

              static {
                  ForgeConfigSpec.Builder b = new ForgeConfigSpec.Builder();
                  b.push("bhop_settings");
                  ENABLE_BHOP = b.comment("Enable or disable the entire Bhop logic").define("enableBhop", true);
                  AUTO_JUMP = b.comment("Hold Space to automatically jump when hitting the ground").define("autoJump", true);
                  DISABLE_FALL_DAMAGE = b.comment("Disable fall damage for players so you don't die from high-speed jumps").define("disableFallDamage", true);
                  b.pop();
                  
                  b.push("physics_tuning");
                  AIR_FRICTION_CANCEL = b.comment("How much vanilla air drag to cancel (1.0 = zero drag like CS2, 0.0 = vanilla Minecraft).").defineInRange("airFrictionCancel", 1.0, 0.0, 1.0);
                  WISH_SPEED = b.comment("The target speed you accelerate towards while strafing in the air.").defineInRange("wishSpeed", 0.45, 0.1, 5.0);
                  AIR_ACCEL = b.comment("Air acceleration multiplier. Higher = tighter and faster turns.").defineInRange("airAccel", 0.08, 0.0, 1.0);
                  MAX_SPEED = b.comment("Absolute maximum speed cap (blocks per tick). 1.0 = 20 blocks/sec.").defineInRange("absoluteMaxSpeed", 1.4, 0.1, 10.0);
                  b.pop();

                  SPEC = b.build();
              }
          }
          """)

          write_f("src/main/java/ru/herda/bhop/client/BhopClientEvents.java", """
          package ru.herda.bhop.client;
          import net.minecraft.client.Minecraft;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import ru.herda.bhop.HerdaBhopMod;
          import ru.herda.bhop.config.BhopConfig;

          @Mod.EventBusSubscriber(modid = HerdaBhopMod.MODID, value = Dist.CLIENT)
          public class BhopClientEvents {
              @SubscribeEvent
              public static void onPlayerTick(TickEvent.PlayerTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;
                  Player player = event.player;
                  Minecraft mc = Minecraft.getInstance();
                  if (player != mc.player) return;

                  if (!BhopConfig.ENABLE_BHOP.get()) return;

                  // 1. CS2 Auto-Jump
                  if (BhopConfig.AUTO_JUMP.get() && mc.options.keyJump.isDown() && player.onGround()) {
                      player.jumpFromGround();
                  }

                  // 2. Source Engine Air Physics (Strafe Mechanics)
                  if (!player.onGround() && !player.isFallFlying() && !player.getAbilities().flying && !player.isInWater() && !player.isInLava()) {
                      Vec3 vel = player.getDeltaMovement();
                      
                      // Cancel Minecraft's heavy air friction
                      double frictionCancel = BhopConfig.AIR_FRICTION_CANCEL.get();
                      double factor = 1.0 + ((1.0 / 0.91) - 1.0) * frictionCancel;
                      double vx = vel.x * factor;
                      double vz = vel.z * factor;

                      float forward = player.input.up ? 1.0F : (player.input.down ? -1.0F : 0.0F);
                      float strafe = player.input.left ? 1.0F : (player.input.right ? -1.0F : 0.0F);

                      if (forward != 0 || strafe != 0) {
                          float yaw = player.getYRot();
                          double angle = Math.toRadians(yaw);
                          
                          double wishX = strafe * Math.cos(angle) - forward * Math.sin(angle);
                          double wishZ = forward * Math.cos(angle) + strafe * Math.sin(angle);
                          
                          double len = Math.sqrt(wishX * wishX + wishZ * wishZ);
                          wishX /= len;
                          wishZ /= len;

                          double currentSpeed = vx * wishX + vz * wishZ;
                          double wishSpeed = BhopConfig.WISH_SPEED.get();
                          double airAccel = BhopConfig.AIR_ACCEL.get();
                          
                          // Classic Source Engine accelerate math
                          double addSpeed = wishSpeed - currentSpeed;
                          if (addSpeed > 0) {
                              double accelSpeed = Math.min(addSpeed, airAccel);
                              vx += wishX * accelSpeed;
                              vz += wishZ * accelSpeed;
                          }
                      }

                      // Apply speed cap (sv_maxvelocity)
                      double absMax = BhopConfig.MAX_SPEED.get();
                      double speedSq = vx * vx + vz * vz;
                      if (speedSq > absMax * absMax && speedSq > 0) {
                          double mult = absMax / Math.sqrt(speedSq);
                          vx *= mult;
                          vz *= mult;
                      }

                      player.setDeltaMovement(vx, vel.y, vz);
                  }
              }
          }
          """)

          write_f("src/main/java/ru/herda/bhop/server/BhopServerEvents.java", """
          package ru.herda.bhop.server;
          import net.minecraft.world.entity.player.Player;
          import net.minecraftforge.event.entity.living.LivingFallEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import ru.herda.bhop.HerdaBhopMod;
          import ru.herda.bhop.config.BhopConfig;

          @Mod.EventBusSubscriber(modid = HerdaBhopMod.MODID)
          public class BhopServerEvents {
              @SubscribeEvent
              public static void onLivingFall(LivingFallEvent event) {
                  if (event.getEntity() instanceof Player) {
                      if (BhopConfig.ENABLE_BHOP.get() && BhopConfig.DISABLE_FALL_DAMAGE.get()) {
                          event.setCanceled(true);
                      }
                  }
              }
          }
          """)
          print("Bhop source files written cleanly.")

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.8 & Build Mod JAR
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.8-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.8/bin/gradle --no-daemon clean build
          cp build/libs/herdabhop-1.0.0.jar ./herdabhop-1.0.0.jar

      - name: Upload Compiled herdabhop-1.0.0.jar
        uses: actions/upload-artifact@v4
        with:
          name: herdabhop-1.0.0-release
          path: herdabhop-1.0.0.jar
